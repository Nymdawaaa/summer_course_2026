<!DOCTYPE html>
<html lang="mn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</head>

<body>

  <div class="profile-card">
    <div class="card-header">
      <div class="avatar-container">
        <img src="image01.png" alt="Profile Picture" class="avatar">

      </div>
      <img src="victor1.png" alt="1" class="vic1">
      <img src="victor2.png" alt="2" class="vic2">
      <img src="victor3.png" alt="3" class="vic3">
      <img src="victor5.png" alt="4" class="vic5">
      <img src="victor6.png" alt="5" class="vic6">
      <img src="victor7.png" alt="6" class="vic7">
    </div>

    <div class="card-body">
      <h2 class="name">Johnny Rogers</h2>
      <p class="username">@jonnyrogers</p>

      <div class="social-links">
        <a href="#"><iconify-icon icon="ic:baseline-facebook"></iconify-icon></a>
        <a href="#"><iconify-icon icon="mdi:linkedin"></iconify-icon></a>
        <a href="#"><iconify-icon icon="simple-icons:x"></iconify-icon></a>
        <a href="#"><iconify-icon icon="ri:instagram-fill"></iconify-icon></a>
        <a href="#"><iconify-icon icon="icon-park-outline:dribble"></iconify-icon></a>
      </div>

      <p class="bio">
        Crafting brand and communication strategies, creating visual designs, leading art direction, and capturing
        portraits through photography.
      </p>

      <div class="action-buttons">
        <button class="btn btn-primary">Follow</button>
        <button class="btn btn-secondary">Message</button>
      </div>
    </div>
  </div>

</body>

</html>
