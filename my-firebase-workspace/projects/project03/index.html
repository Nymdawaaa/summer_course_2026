<!DOCTYPE html>
<html lang="mn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>


  <div class="controls">
    <h2>Weather Simulator</h2>
    <div class="buttons">
      <button onclick="setWeather('sunny')">☀️ Sunny</button>
      <button onclick="setWeather('rainy')">🌧️ Rainy</button>
      <button onclick="setWeather('snowy')">❄️ Snowy</button>
      <button onclick="setWeather('night')">🌙 Night</button>
    </div>



  </div>


  <div id="sky" class="sunny">

    <div id="weather-effects"></div>


    <div class="celestial-body"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="cloud cloud4"></div>

    <div class="mountains-container">
      <div class="mountain m1"></div>
      <div class="mountain m2"></div>
      <div class="mountain m3"></div>
      <div class="mountain m4"></div>
    </div>


    <div class="ground"></div>
  </div>

  <script src="script.js"></script>
</body>

</html>
