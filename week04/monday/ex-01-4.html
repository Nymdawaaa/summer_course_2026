<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding-top: 50px;
            padding-bottom: 50px;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #333;
            color: white;
            text-align: center;
            line-height: 50px;
            z-index: 1000;
        }
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #333;
            color: white;
            text-align: center;
            line-height: 50px;
            z-index: 1000;
        }
        .content {
            padding: 20px;
            min-height: 1500px;
            margin-left: 400px;
            margin-top: 300px;
        }
    </style>
</head>

<body>
    <header>fixed header</header>
    <div class="content">
        <h2>content</h2>
    </div>
    <footer>fixed footer</footer>
</body>

</html>
