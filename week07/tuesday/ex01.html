<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ex01.css">
</head>
<body>
    <script src="./p5.min.js"></script>
    <script src="./js/ex01.js"></script>
    <h1>shape controller</h1>
    <div class="controls">
         <label for="size-slider">
            size
         </label>
         <input id="size-slider" type="range" min="30" max="200" value="100">
         <label for="color-input">
            color
         </label>
         <input id="color-input" type="color" value="#3498db">
         <label for="shape-select">
            shape
         </label>
         <select id="shape-select">
            <option value="circle">circle</option>
            <option value="square">square</option>
         </select>
    </div>
    <div id="canvas-container"></div>
</body>
</html>
